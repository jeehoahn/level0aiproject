<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <title>Treasure Hunt</title>
    <link rel="stylesheet" href="style.css">
</head>

<body>

<h1>Treasure Hunt</h1>

<button id="connectButton">게임 시작</button>

<div id="gameArea">

    <div id="statusPanel">
        <h2>게임 정보</h2>

        <p>현재 레벨: <span id="level">1</span></p>
        <p>파트너: <span id="partner">없음</span></p>
        <p>남은 폭탄: <span id="remainingBombs">0</span></p>
        <p>남은 동물: <span id="remainingAnimals">0</span></p>
        <p>남은 탐색 횟수: <span id="remainingExploration">0</span></p>
        <p>보유 골드: <span id="gold">0</span></p>
        <p>레벨업 시 얻을 돈: <span id="nextLevelGold">0</span></p>
    </div>

    <div id="board"></div>

    <div id="dialoguePanel">
        <h2>대사</h2>
        <div id="output">게임을 시작해주세요.</div>
    </div>

</div>

<script src="js/app.js"></script>

</body>
</html>
